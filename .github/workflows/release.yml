name: release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  CLI_BINARY: "webctx"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node checks
        run: npm --prefix npm test

      - name: Verify npm source fallback builds
        run: |
          node npm/scripts/prepare-package.mjs "${GITHUB_REF_NAME#v}"
          (cd npm/.publish && go build -o "$RUNNER_TEMP/webctx-npm-fallback" ./cmd/webctx)
          npm pack ./npm/.publish --dry-run --ignore-scripts

  build-binaries:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build binary
        run: |
          mkdir -p dist
          EXT=""
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X github.com/amxv/webctx/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${{ env.CLI_BINARY }}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" ./cmd/${{ env.CLI_BINARY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  windows-smoke:
    needs: build-binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            goarch: "386"
          - runner: windows-latest
            goarch: amd64
          - runner: windows-11-arm
            goarch: arm64
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v8
        with:
          name: binary-windows-${{ matrix.goarch }}
          path: dist

      - name: Run Windows binary and check version
        shell: pwsh
        run: |
          $binary = "./dist/webctx_windows_${{ matrix.goarch }}.exe"
          $version = & $binary --version
          $expectedVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($LASTEXITCODE -ne 0 -or $version -ne $expectedVersion) {
            throw "Windows ${{ matrix.goarch }} smoke test failed: $version"
          }

  github-release:
    needs: [build-binaries, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Prepare npm distribution with tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node npm/scripts/prepare-package.mjs "$VERSION"

      - name: Publish to npm
        run: npm publish ./npm/.publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
